services:
    frontend:
        build: ./frontend
        ports:
            - "5173:5173"
        volumes:
            - "./frontend/src:/app/src"
        env_file:
            - ./.env
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: nosql-neo4j-api
        ports:
        - "3004:3000"
        environment:
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USER: neo4j
            NEO4J_PASSWORD: password
        depends_on:
            neo4j:
                condition: service_healthy
        networks:
        - nosql-network
        volumes:
        - ./backend:/app
        - /app/node_modules
    neo4j:
        image: neo4j:5
        container_name: nosql-neo4j
        ports:
        - "7474:7474"  # HTTP
        - "7687:7687"  # Bolt
        environment:
            NEO4J_AUTH: neo4j/password
            NEO4J_PLUGINS: '["apoc"]'
        volumes:
        - neo4j_data:/data
        - neo4j_logs:/logs
        healthcheck:
            test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "--database", "system", "SHOW DATABASES"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 40s
        networks:
        - nosql-network

volumes:
    neo4j_data:
    neo4j_logs:

networks:
  nosql-network: